name: release

# A version tag (v0.2.0, matching pyproject.toml) builds and tests the Windows app and puts it into a
# draft GitHub release: Setup.exe for new installs, plus the Velopack update files the installed apps
# fetch. Nothing reaches anyone until "Publish release" is pressed on GitHub.
# "Run workflow" (Actions tab, any branch) makes the same build and tests without a release; its
# Setup.exe is attached to the run as a download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub release and upload its files

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      FOTOBUCH_VERSION: v0.3.0
      VPK_VERSION: 1.2.161  # the same version as the velopack Python package in uv.lock
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Version
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".TrimStart("v") -ne $ver) {
            throw "tag ${{ github.ref_name }} does not match the version in pyproject.toml ($ver)"
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fotobuch
        shell: pwsh
        run: |
          ./packaging/windows/get_fotobuch.ps1 -Dest "$env:RUNNER_TEMP\fotobuch" -Version $env:FOTOBUCH_VERSION
          "FOTOBUCH_BIN=$env:RUNNER_TEMP\fotobuch\fotobuch.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        run: uv run --python 3.12 --frozen pytest -q

      - name: Build the app (PyInstaller)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # a failing program stops the step
          # where the installed app looks for updates
          Set-Content -Encoding utf8 src/autobook/_build.py `
            "UPDATE_FEED = `"https://github.com/${{ github.repository }}/releases/latest/download`""
          uv run --python 3.12 --frozen python packaging/windows/make_icon.py
          uv run --python 3.12 --frozen --with pyinstaller pyinstaller --noconfirm --distpath dist --workpath build packaging/windows/autobook.spec
          Copy-Item -Recurse "$env:RUNNER_TEMP\fotobuch" dist/autobook/fotobuch
          Copy-Item LICENSE, NOTICE dist/autobook/

      - name: Smoke test of the built app (bundled Fotobuch, no Python)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:FOTOBUCH_BIN
          $env:AUTOBOOK_LIBRARY = "$env:RUNNER_TEMP\library"
          $app = "dist/autobook/autobook-cli.exe"
          & $app doctor
          & $app demo-photos "$env:RUNNER_TEMP\demo" --scale 0.4 --long-edge 1200
          & $app all "$env:RUNNER_TEMP\demo" --work "$env:RUNNER_TEMP\book" --offline
          & $app release --work "$env:RUNNER_TEMP\book"
          # the browser app starts and answers
          $ui = Start-Process -FilePath $app -ArgumentList "ui", "--no-browser", "--port", "8790" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try { $ok = (Invoke-RestMethod http://127.0.0.1:8790/api/ping).app -eq "autobook" } catch { }
            }
            if (-not $ok) { throw "autobook ui did not answer on port 8790" }
          } finally {
            Stop-Process -Id $ui.Id -Force
          }

      - name: Start the desktop app (no console window, tray icon)
        shell: pwsh
        run: |
          $env:AUTOBOOK_STATE = "$env:RUNNER_TEMP\state"
          $env:AUTOBOOK_LIBRARY = "$env:RUNNER_TEMP\library"
          $p = Start-Process -FilePath dist/autobook/autobook.exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok -and -not $p.HasExited; $i++) {
              Start-Sleep -Seconds 1
              $f = "$env:AUTOBOOK_STATE\instance.json"
              if (Test-Path $f) {
                $url = (Get-Content $f -Raw | ConvertFrom-Json).url -replace '/\?.*$', ''
                try { $ok = (Invoke-RestMethod "$url/api/ping").app -eq "autobook" } catch { }
              }
            }
            if (-not $ok) {
              Get-ChildItem -Recurse "$env:LOCALAPPDATA\autobook" -Filter *.log -ErrorAction SilentlyContinue | Get-Content
              throw "autobook.exe did not start (exited: $($p.HasExited))"
            }
            Write-Host "autobook.exe answers at $url"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Installer and update files (Velopack)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # the latest published release, so the installed apps get a small delta update
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN --outputDir releases
          if ($LASTEXITCODE) { Write-Host "no earlier release to build a delta from" }
          # win-x64: Python and fotobuch.exe are 64-bit (vpk would assume x86)
          vpk pack --packId autobook --packVersion $env:VERSION --packDir dist/autobook --mainExe autobook.exe `
            --packTitle autobook --icon packaging/windows/autobook.ico --runtime win-x64 --outputDir releases
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem releases | Format-Table Name, Length

      - name: Draft release (publish it on GitHub after a look)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN `
            --outputDir releases --releaseName "autobook $env:VERSION" --tag "${{ github.ref_name }}" --merge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Installer of a test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: autobook-${{ env.VERSION }}-test-setup
          path: releases/*Setup.exe
          if-no-files-found: error

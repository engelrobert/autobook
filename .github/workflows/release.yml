name: release

# A version tag (v0.2.0, matching pyproject.toml) builds, tests and publishes the Windows app:
#   Setup.exe for new installs, plus the Velopack update files the installed apps fetch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the GitHub release and upload its files

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      FOTOBUCH_VERSION: v0.3.0
      VPK_VERSION: 1.2.161  # the same version as the velopack Python package in uv.lock
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Version from the tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $proj = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($ver -ne $proj) { throw "tag $ver does not match the version in pyproject.toml ($proj)" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fotobuch
        shell: pwsh
        run: |
          ./packaging/windows/get_fotobuch.ps1 -Dest "$env:RUNNER_TEMP\fotobuch" -Version $env:FOTOBUCH_VERSION
          "FOTOBUCH_BIN=$env:RUNNER_TEMP\fotobuch\fotobuch.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        run: uv run --python 3.12 --frozen pytest -q

      - name: Build the app (PyInstaller)
        shell: pwsh
        run: |
          # where the installed app looks for updates
          Set-Content -Encoding utf8 src/autobook/_build.py `
            "UPDATE_FEED = `"https://github.com/${{ github.repository }}/releases/latest/download`""
          uv run --python 3.12 --frozen python packaging/windows/make_icon.py
          uv run --python 3.12 --frozen --with pyinstaller pyinstaller --noconfirm --distpath dist --workpath build packaging/windows/autobook.spec
          Copy-Item -Recurse "$env:RUNNER_TEMP\fotobuch" dist/autobook/fotobuch
          Copy-Item LICENSE, NOTICE dist/autobook/

      - name: Smoke test of the built app (bundled Fotobuch, no Python)
        shell: pwsh
        run: |
          Remove-Item Env:FOTOBUCH_BIN
          $app = "dist/autobook/autobook-cli.exe"
          & $app doctor
          & $app demo-photos "$env:RUNNER_TEMP\demo" --scale 0.4 --long-edge 1200
          & $app all "$env:RUNNER_TEMP\demo" --work "$env:RUNNER_TEMP\book" --offline
          & $app release --work "$env:RUNNER_TEMP\book"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Installer and update files (Velopack)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $repo = "https://github.com/${{ github.repository }}"
          # the previous release, so the installed apps get a small delta update
          vpk download github --repoUrl $repo --token $env:GH_TOKEN --outputDir releases
          if ($LASTEXITCODE) { Write-Host "no earlier release to build a delta from" }
          vpk pack --packId autobook --packVersion $env:VERSION --packDir dist/autobook --mainExe autobook.exe `
            --packTitle autobook --icon packaging/windows/autobook.ico --outputDir releases
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          vpk upload github --repoUrl $repo --token $env:GH_TOKEN --outputDir releases --publish `
            --releaseName "autobook $env:VERSION" --tag "${{ github.ref_name }}" --merge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
